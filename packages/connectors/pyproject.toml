[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "messer-connectors"
version = "1.0.0"
description = "Messer connector catalog and adapters: OAuth providers, databases, webhooks, HTTP and MCP servers."
requires-python = ">=3.12"
dependencies = [
  "messer-common",
  "httpx>=0.28",
  "jsonschema>=4.23",
  "psycopg[binary]>=3.2.3",
  "pymysql>=1.1.1",
  "python-tds>=1.16",
]

[project.optional-dependencies]
# MCP servers are listed and called through the engine's MCPServer (packages/messer-core).
mcp = ["messer-core"]

[tool.hatch.build.targets.wheel]
packages = ["src/messer_connectors"]
