[package]
name = "messer-tui"
version = "1.2.3"
edition = "2024"
description = "Terminal UI for Messer AI agent framework"
license = "Apache-2.0"
authors = ["Messer AI <team@messer.local>"]
repository = "https://github.com/marcsolans/northfold"
homepage = "https://messer.local"
readme = "README.md"
keywords = ["tui", "terminal", "ai", "agent"]
categories = ["command-line-interface"]

[[bin]]
name = "messer"
path = "src/main.rs"

[[bin]]
name = "precompute-frames"
path = "src/bin/precompute_frames.rs"

[dependencies]
chrono = "0.4.44"
color-eyre = "0.6.5"
crossterm = "0.28"
dirs = "6.0.0"
ratatui = "0.30.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9"
symphonia = { version = "0.5", default-features = false, features = ["mp3"] }
tokio = { version = "1", features = ["full"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
