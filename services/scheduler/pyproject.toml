[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "messer-scheduler"
version = "1.0.0"
description = "Messer scheduler: cron triggers, source watching, expiries, alarms and periodic jobs."
requires-python = ">=3.12"
dependencies = [
  "messer-common",
  "messer-api",
  "croniter>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/messer_scheduler"]
