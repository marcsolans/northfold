[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "messer-voice"
version = "1.0.0"
description = "Messer voice gateway: browser, phone (Twilio/Telnyx) and LiveKit voice sessions driving agents through the runtime."
requires-python = ">=3.12"
dependencies = [
  "messer-common",
  "messer-core[server,voice,voice-livekit]",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "httpx>=0.28",
  "websockets>=15.0",
  "pyjwt>=2.10",
  "cryptography>=44",
]

[tool.hatch.build.targets.wheel]
packages = ["src/messer_voice"]
