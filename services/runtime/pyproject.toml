[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "messer-runtime"
version = "1.0.0"
description = "Messer data plane runtime: sandboxed execution of project agents and workflows, model gateway, tracing."
requires-python = ">=3.12"
dependencies = [
  "messer-common",
  "messer-core[server,evals,documents]",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "httpx>=0.28",
  "anthropic[bedrock]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/messer_runtime"]
