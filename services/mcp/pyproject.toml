[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "messer-mcp"
version = "1.0.0"
description = "Messer MCP server: lets Claude Code, Cursor, VS Code and other MCP clients build, evaluate and deploy Messer agents."
requires-python = ">=3.12"
dependencies = [
  "messer-common",
  "mcp>=1.26,<2",
  "httpx>=0.28",
  "starlette>=0.40",
  "uvicorn[standard]>=0.34",
]

[project.scripts]
messer-mcp = "messer_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/messer_mcp"]
