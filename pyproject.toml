[tool.uv.workspace]
members = [
  "packages/messer-core",
  "packages/messer-common",
  "packages/connectors",
  "services/connector-agent",
  "apps/api",
  "services/worker",
  "services/scheduler",
  "services/runtime",
  "services/voice",
]

[tool.uv.sources]
messer-core = { workspace = true }
messer-common = { workspace = true }
messer-connectors = { workspace = true }
messer-connector-agent = { workspace = true }
messer-api = { workspace = true }
messer-worker = { workspace = true }
messer-scheduler = { workspace = true }
messer-runtime = { workspace = true }
messer-voice = { workspace = true }

[dependency-groups]
dev = [
  "messer-core[all]",
  "messer-common",
  "messer-connectors[mcp]",
  "messer-connector-agent",
  "messer-api",
  "messer-worker",
  "messer-scheduler",
  "messer-runtime",
  "messer-voice",
  "httpx>=0.28",
  "lancedb>=0.25.3",
  "pyngrok>=7.2.3",
  "pytest>=8.3.4",
  "pytest-asyncio>=0.25.2",
  "pytest-cov>=7.0.0",
  "pytest-xdist>=3.6.1",
  "yappi>=1.7.6",
  "ruff>=0.9.3",
  "pyright>=1.1.400",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = ["-q", "--tb=short", "-p", "no:cacheprovider"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "T20", "RUF"]
ignore = ["E501", "B008", "S101", "RUF001", "RUF002", "RUF003", "S608", "RUF012", "S106", "S107", "S603", "S607"]

[tool.ruff.lint.isort]
known-first-party = ["messer", "messer_common", "messer_api", "messer_runtime", "messer_worker", "messer_scheduler",
                     "messer_voice", "messer_mcp", "messer_connectors", "messer_sdk", "messer_connector_agent"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106", "S108", "S311"]
"**/messer_common/testing/**" = ["S108", "S110"]
"infra/migrations/**" = ["S608"]
