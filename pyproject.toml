# Messer monorepo — uv workspace root (virtual: not a package itself).
[project]
name = "messer-monorepo"
version = "0.0.0"
requires-python = ">=3.12,<3.14"
dependencies = []

[tool.uv]
package = false
# Engine dependencies are pinned to the versions the upstream engine was tested with
# (see DECISIONS.md, D-003). Platform-only dependencies resolve freely.
