{{- if .Values.networkPolicy.enabled }}
{{- $root := . }}
{{- $egress := .Values.networkPolicy.egress }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "messer.fullname" . }}
  labels:
    {{- include "messer.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "messer.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
  ingress:
    # Data-plane components talk to each other (worker → runtime, voice → runtime…).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
    {{- with .Values.networkPolicy.ingressNamespaceSelector }}
    - from:
        - namespaceSelector:
            {{- toYaml . | nindent 12 }}
      ports:
        {{- range $component, $spec := $root.Values.components }}
        {{- if and $spec.enabled (gt (int $spec.port) 0) }}
        - {port: {{ $spec.port }}, protocol: TCP}
        {{- end }}
        {{- end }}
    {{- end }}
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
    - ports:
        - {port: 5432, protocol: TCP}
        - {port: 6432, protocol: TCP}
      {{- with $egress.postgresCidrs }}
      to:
        {{- range . }}
        - ipBlock: {cidr: {{ . }}}
        {{- end }}
      {{- end }}
    - ports:
        - {port: 6379, protocol: TCP}
        - {port: 6380, protocol: TCP}
      {{- with $egress.redisCidrs }}
      to:
        {{- range . }}
        - ipBlock: {cidr: {{ . }}}
        {{- end }}
      {{- end }}
    - ports:
        - {port: 443, protocol: TCP}
      {{- with $egress.httpsCidrs }}
      to:
        {{- range . }}
        - ipBlock: {cidr: {{ . }}}
        {{- end }}
      {{- end }}
    {{- with $egress.extraRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
