{{- $root := . }}
{{- range $component, $spec := .Values.components }}
{{- if $spec.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "messer.componentName" (dict "root" $root "component" $component) }}
  labels:
    {{- include "messer.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  {{- if not $spec.autoscaling.enabled }}
  replicas: {{ $spec.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "messer.selectorLabels" (dict "root" $root "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "messer.selectorLabels" (dict "root" $root "component" $component) | nindent 8 }}
        {{- with $root.Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $root.Template.BasePath "/configmap.yaml") $root | sha256sum }}
        {{- with $root.Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "messer.serviceAccountName" $root }}
      automountServiceAccountToken: false
      {{- with $root.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml $root.Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ if eq $component "worker" }}1800{{ else }}60{{ end }}
      containers:
        - name: {{ $component }}
          image: {{ include "messer.image" (dict "root" $root "spec" $spec) | quote }}
          imagePullPolicy: {{ $root.Values.global.imagePullPolicy }}
          {{- with $spec.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if gt (int $spec.port) 0 }}
          ports:
            - name: http
              containerPort: {{ $spec.port }}
              protocol: TCP
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "messer.fullname" $root }}
            - secretRef:
                name: {{ required "secrets.existingSecret is required (database, Redis and signing keys)" $root.Values.secrets.existingSecret }}
            {{- range $root.Values.secrets.extraEnvFromSecrets }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          env:
            - name: MESSER_SERVICE
              value: {{ $component | quote }}
            {{- range $key, $value := $spec.extraEnv }}
            - name: {{ $key }}
              value: {{ $value | toString | quote }}
            {{- end }}
          {{- if and $spec.probes.enabled (gt (int $spec.port) 0) }}
          startupProbe:
            httpGet: {path: {{ $spec.probes.path }}, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: {{ $spec.probes.path }}, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: {{ $spec.probes.path }}, port: http}
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          {{- end }}
          resources:
            {{- toYaml $spec.resources | nindent 12 }}
          securityContext:
            {{- toYaml $root.Values.securityContext | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: cache, mountPath: /cache}
            {{- if $root.Values.persistence.enabled }}
            - {name: data, mountPath: /data}
            {{- end }}
            {{- if $root.Values.mtls.enabled }}
            - {name: mtls, mountPath: {{ $root.Values.mtls.mountPath | quote }}, readOnly: true}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {sizeLimit: 10Gi}
        {{- if $root.Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "messer.pvcName" $root }}
        {{- end }}
        {{- if $root.Values.mtls.enabled }}
        - name: mtls
          secret:
            secretName: {{ required "mtls.existingSecret is required when mtls.enabled" $root.Values.mtls.existingSecret }}
            defaultMode: 0400
        {{- end }}
      {{- with $root.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $root.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $root.Values.affinity }}
      affinity:
        {{- toYaml $root.Values.affinity | nindent 8 }}
      {{- else }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "messer.selectorLabels" (dict "root" $root "component" $component) | nindent 20 }}
      {{- end }}
      {{- with $root.Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
