name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Non-secret values for CI only. Real secrets live in Vercel / GitHub environments.
  DATABASE_URL: postgresql://northfold:northfold@localhost:5432/northfold?schema=public
  DIRECT_URL: postgresql://northfold:northfold@localhost:5432/northfold?schema=public
  TEST_DATABASE_URL: postgresql://northfold:northfold@localhost:5432/northfold_test?schema=public
  BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
  BETTER_AUTH_URL: http://localhost:3000
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  ADMIN_EMAILS: admin@northfold.test
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: northfold
          POSTGRES_PASSWORD: northfold
          POSTGRES_DB: northfold
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U northfold"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Create test database
        run: PGPASSWORD=northfold psql -h localhost -U northfold -d northfold -c "CREATE DATABASE northfold_test"
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit + integration tests (with coverage)
        run: pnpm test:coverage
      - name: Migrate and seed the build database
        run: pnpm db:deploy && pnpm db:seed
      - name: Build
        run: pnpm build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: northfold
          POSTGRES_PASSWORD: northfold
          POSTGRES_DB: northfold_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U northfold"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://northfold:northfold@localhost:5432/northfold_e2e?schema=public
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Playwright
        run: pnpm test:e2e
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
